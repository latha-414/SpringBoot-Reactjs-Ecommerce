version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin <aws_account_id>.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
  build:
    commands:
      - echo Building backend Docker image...
      - mvn clean package -DskipTests
      - docker build -t ecommerce-backend Ecommerce-Backend/
      - docker tag ecommerce-backend:latest <aws_account_id>.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/ecommerce-backend:latest
  post_build:
    commands:
      - echo Pushing backend Docker image...
      - docker push <aws_account_id>.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/ecommerce-backend:latest
